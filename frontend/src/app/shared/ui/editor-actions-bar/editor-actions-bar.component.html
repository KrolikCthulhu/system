<div class="editor-actions-bar">
	<p-button
		[label]="resetLabel()"
		severity="secondary"
		variant="outlined"
		[disabled]="isResetDisabled"
		(onClick)="reset.emit()"
	></p-button>
	<p-button
		[label]="saveLabel()"
		[loading]="saving()"
		[disabled]="isSaveDisabled"
		(onClick)="save.emit()"
	></p-button>
</div>
