@if (card().auto; as auto) {
	<app-spell-auto-parameter-editor
		[value]="auto.value"
		[scope]="auto.scope"
		[characterOptions]="auto.characterOptions"
		[scaleOptions]="auto.scaleOptions"
		[rangeModeOptions]="auto.rangeModeOptions"
		[sourceModeOptions]="auto.sourceModeOptions"
		[sourceKindOptions]="auto.sourceKindOptions"
		[sourceTargetOptions]="auto.sourceTargetOptions"
		[sourceCurveOptions]="auto.sourceCurveOptions"
		[sourceTransformOptions]="auto.sourceTransformOptions"
		[roundingModeOptions]="auto.roundingModeOptions"
		[sourceKeyOptions]="auto.sourceKeyOptions"
		[transformSourceOptions]="auto.transformSourceOptions"
		[defaultSourceKey]="auto.defaultSourceKey"
		[sourceKeyLabel]="auto.sourceKeyLabel"
		[sourceSummary]="auto.sourceSummary"
		[isSourceCollapsed]="auto.isSourceCollapsed"
		[presetOptions]="auto.presetOptions"
		[presetPanelStyle]="auto.presetPanelStyle"
		(parameterPatch)="card().actions.patchAuto($event)"
		(sourceModeChange)="card().actions.changeAutoSourceMode($event)"
		(sourceAdd)="card().actions.addAutoSource()"
		(sourcePatch)="card().actions.patchAutoSource($event)"
		(sourceDelete)="card().actions.deleteAutoSource($event)"
		(sourceCollapseToggle)="card().actions.toggleAutoSourceCollapsed($event)"
		(presetApply)="card().actions.applyAutoPreset($event)"
		(helpClick)="helpClick.emit($event)"
	></app-spell-auto-parameter-editor>
}
