<div class="admin-spell-detail-page__mechanics-layout">
	@let listVm = vm.blockListVm();
	<app-spell-mechanic-block-list
		[items]="listVm.items"
		[selectedIndex]="listVm.selectedIndex"
		(addMechanic)="listVm.actions.add()"
		(selectMechanic)="listVm.actions.select($event)"
		(moveMechanic)="listVm.actions.move($event)"
	></app-spell-mechanic-block-list>

	<section class="admin-spell-detail-page__mechanics-editor">
		@if (vm.selectedBlockVm(); as blockVm) {
			<app-spell-mechanic-block-summary
				[mechanicId]="blockVm.block.mechanicId"
				[isActive]="blockVm.block.isActive"
				[mechanicOptions]="blockVm.mechanicOptions"
				[previewText]="blockVm.previewText"
				[applicationText]="blockVm.applicationText"
				[applicationConfig]="blockVm.applicationConfig"
				(mechanicChange)="blockVm.actions.changeMechanic($event)"
				(activeChange)="blockVm.actions.changeActive($event)"
				(deleteBlock)="blockVm.actions.delete()"
				(applicationChange)="blockVm.actions.changeApplication($event)"
			></app-spell-mechanic-block-summary>

			<app-spell-mechanic-parameters-section
				[cards]="vm.parameterCardsVm()"
				(helpClick)="helpClick.emit($event)"
			></app-spell-mechanic-parameters-section>

			@if (vm.effectScaleVm(); as scaleVm) {
				<app-spell-mechanic-effect-scale-section
					[block]="scaleVm.block"
					[config]="scaleVm.config"
					[mechanicOptions]="scaleVm.mechanicOptions"
					[modeOptions]="scaleVm.modeOptions"
					[mechanicParameters]="scaleVm.mechanicParameters"
					[usesParameterSelect]="scaleVm.usesParameterSelect"
					[parameterOptions]="scaleVm.parameterOptions"
					[parameterValue]="scaleVm.parameterValue"
					[staticParameterValue]="scaleVm.staticParameterValue"
					[updateConfig]="scaleVm.actions.updateConfig"
					[addNestedMechanic]="scaleVm.actions.addNestedMechanic"
					[updateNestedMechanic]="scaleVm.actions.updateNestedMechanic"
					[deleteNestedMechanic]="scaleVm.actions.deleteNestedMechanic"
					[updateNestedParameter]="scaleVm.actions.updateNestedParameter"
				></app-spell-mechanic-effect-scale-section>
			}
		} @else {
			<div class="admin-spell-detail-page__empty-block">
				Выбери механику слева или добавь новую.
			</div>
		}
	</section>
</div>
