<section class="admin-attribute-detail-page">
	<header class="admin-attribute-detail-page__header">
		<p-breadcrumb
			class="admin-attribute-detail-page__breadcrumbs"
			[model]="breadcrumbs()"
		></p-breadcrumb>
	</header>

	@if (loading()) {
		<section
			class="admin-attribute-detail-page__panel admin-attribute-detail-page__state"
		>
			Загрузка атрибута...
		</section>
	} @else if (errorMessage()) {
		<section
			class="admin-attribute-detail-page__panel admin-attribute-detail-page__state admin-attribute-detail-page__state--error"
		>
			{{ errorMessage() }}
		</section>
	} @else if (attribute(); as attribute) {
		<section class="admin-attribute-detail-page__panel">
			<div class="admin-attribute-detail-page__panel-heading">
				<h1 class="admin-attribute-detail-page__title">{{ attribute.name }}</h1>
			</div>

			<p-tabs
				class="admin-attribute-detail-page__content"
				[value]="activeTab()"
				(valueChange)="setActiveTab($event)"
			>
				<p-tablist>
					<p-tab value="general">Общее</p-tab>
					<p-tab [disabled]="!canEditCalculation()" value="calculation">
						Расчёт
					</p-tab>
				</p-tablist>

				<p-tabpanels class="admin-attribute-detail-page__tabpanels">
					<p-tabpanel
						class="admin-attribute-detail-page__tabpanel"
						value="general"
					>
						<p-fluid>
							<form
								class="admin-attribute-detail-page__form"
								[formGroup]="form"
							>
								<div class="admin-attribute-detail-page__grid">
									<div class="admin-attribute-detail-page__field">
										<label
											class="admin-attribute-detail-page__field-label"
											for="attribute-name"
										>
											Название
										</label>
										<input
											id="attribute-name"
											pInputText
											formControlName="name"
										/>
									</div>

									<div class="admin-attribute-detail-page__field">
										<label
											class="admin-attribute-detail-page__field-label"
											for="attribute-sort-order"
										>
											Порядок сортировки
										</label>
										<p-inputnumber
											formControlName="sortOrder"
											inputId="attribute-sort-order"
											[min]="0"
											[showButtons]="false"
										></p-inputnumber>
									</div>
								</div>

								<div class="admin-attribute-detail-page__grid">
									<div class="admin-attribute-detail-page__field">
										<label class="admin-attribute-detail-page__field-label">
											Режим значения
										</label>
										<p-select
											optionLabel="label"
											optionValue="value"
											[options]="baseSourceOptions"
											[ngModel]="systemValueCalculation()?.baseSourceType"
											[ngModelOptions]="{ standalone: true }"
											(ngModelChange)="updateSystemValueBaseSourceType($event)"
										></p-select>
									</div>
								</div>

								<div class="admin-attribute-detail-page__field">
									<label
										class="admin-attribute-detail-page__field-label"
										for="attribute-description"
									>
										Описание
									</label>
									<textarea
										id="attribute-description"
										pTextarea
										formControlName="description"
										rows="4"
									></textarea>
								</div>
							</form>
						</p-fluid>
					</p-tabpanel>

					<p-tabpanel
						class="admin-attribute-detail-page__tabpanel"
						value="calculation"
					>
						<section class="admin-attribute-detail-page__system-value">
							<app-system-value-calculation-editor
								class="admin-attribute-detail-page__calculation-editor"
								[showBaseSourceField]="false"
								[systemValue]="systemValueCalculation()"
								[availableValues]="availableValues()"
								(systemValueChange)="updateSystemValueCalculation($event)"
							></app-system-value-calculation-editor>
						</section>
					</p-tabpanel>
				</p-tabpanels>
			</p-tabs>

			<div class="admin-attribute-detail-page__actions">
				<p-button
					label="Сбросить"
					severity="secondary"
					variant="outlined"
					(onClick)="cancelAttribute()"
				></p-button>
				<p-button
					label="Сохранить"
					[disabled]="isSaveDisabled()"
					(onClick)="saveAttribute()"
				></p-button>
			</div>
		</section>
	} @else {
		<section
			class="admin-attribute-detail-page__panel admin-attribute-detail-page__state"
		>
			Атрибут не найден.
		</section>
	}
</section>
